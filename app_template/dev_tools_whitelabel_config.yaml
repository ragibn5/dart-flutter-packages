# Project-root-relative glob patterns not included in a white-label project.
exclude:
  - .dart_tool
  - build
  - .idea
  - coverage
  - .flutter-plugins
  - .flutter-plugins-dependencies
  - .packages
  - pubspec.lock
  - android/build
  - android/.cxx
  - android/app/.cxx
  - android/app/.gradle
  - ios/build
  - ios/.symlinks
  - ios/Pods
  - ios/Podfile.lock
  - linux/build
  - macos/build
  - windows/build
  - '**/*.iml'

# Default per-flavor Firebase settings, pre-filling the whitelabel firebase
# setup prompts. Update these to match your own Firebase projects.
firebase:
  dev:
    project_id: flutter-app-template-b1e3c
    ios_bundle_id: com.ragibn5.fat.dev
    android_package_name: com.ragibn5.fat.dev
  exp:
    project_id: flutter-app-template-b1e3c
    ios_bundle_id: com.ragibn5.fat.exp
    android_package_name: com.ragibn5.fat.exp
  stage:
