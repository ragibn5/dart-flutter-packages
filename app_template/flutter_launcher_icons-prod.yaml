# flutter pub run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/external/images/app_icon_color_padded.png"

  android: "ic_launcher"
  image_path_android: "assets/external/images/app_icon_color_padded.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/external/images/app_icon_color_padded.png"
  adaptive_icon_foreground_inset: 16
  adaptive_icon_monochrome: "assets/external/images/app_icon_monochrome_padded.png"

  ios: true
  image_path_ios: "assets/external/images/app_icon_color_padded.png"
  remove_alpha_ios: true
  image_path_ios_dark_transparent: "assets/external/images/app_icon_color_padded.png"
  image_path_ios_tinted_grayscale: "assets/external/images/app_icon_monochrome_padded.png"
  desaturate_tinted_to_grayscale_ios: true
  background_color_ios: "#ffffff"

  web:
    generate: false
    image_path: "path/to/image.png"
    background_color: "#hexcode"
    theme_color: "#hexcode"

  windows:
    generate: false
    image_path: "path/to/image.png"
    icon_size: 48 # min:48, max:256, default: 48

  macos:
    generate: false
    image_path: "path/to/image.png"
