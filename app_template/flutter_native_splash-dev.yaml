# ============================================================
# SPLASH IMAGE SIZE SPECS — from flutter_native_splash docs
# https://pub.dev/packages/flutter_native_splash
# ============================================================
#
# TOP-LEVEL KEYS (Android < 12, iOS, web — NOT Android 12+):
#   image:     PNG sized for 4x pixel density (xxxhdpi).
#              Use 1152 x 1152 px transparent canvas, content inside
#              a 768 px-diameter centered circle (recommended content
#              size 384 x 384 to 512 x 512 px).
#   branding:  PNG at least 200(w) x 80(h), same aspect ratio.
#   branding_bottom_padding:  bottom offset in px (default 0).
#
# ANDROID 12+ KEYS (android_12: — system splash, different rules):
#   image:     1152 x 1152 px, content inside a 768 px-diameter circle.
#   branding:  MUST be 800 x 320 px.
#
# Regenerate after changes:
#   dart run flutter_native_splash:create --all-flavors
# ============================================================
flutter_native_splash:
  # Window/screen background color (Android < 12, iOS, web). Required.
  color: "#ffffff"
  # Center splash logomark. PNG, 4x density (1152x1152 frame / content within 768px circle).
  image: assets/external/images/splash.png
  # Branding logo near screen bottom. PNG, at least 200x80, same aspect ratio.
  branding: assets/external/images/branding.png

  # Dark-mode variants (same size rules as the light versions above).
  color_dark: "#121212"
  image_dark: assets/external/images/splash.png
  branding_dark: assets/external/images/branding.png

  # Bottom offset of the branding image (Android < 12, iOS). Default 0.
  branding_bottom_padding: 24

  # ================= ANDROID 12+ ONLY =================
  android_12:
    # Center icon. No icon_background_color -> 1152 x 1152 px with content
    # inside a 768 px-diameter circle; blends directly with the window bg.
    image: assets/external/images/splash.png
    image_dark: assets/external/images/splash.png
    # Android 12+ branding MUST be 800 x 320 px.
    branding: assets/external/images/branding.png
    branding_dark: assets/external/images/branding.png

  web: false