name: Set up
description: Installs the pinned Flutter version. Run after actions/checkout.

runs:
  using: composite
  steps:
    - name: Read the pinned Flutter version
      id: flutter
      shell: bash
      run: |
        echo "version=$(sed -n 's/.*"flutter": *"\([^"]*\)".*/\1/p' .fvmrc)" >> "$GITHUB_OUTPUT"

    - name: Install Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ steps.flutter.outputs.version }}
        channel: stable
        cache: true
