name: Enforce coverage

on:
  pull_request:
    branches:
      - main
      - develop

jobs:
  # Always runs and reports, so the coverage job below can be a required
  # check: when it's skipped by its `if`, GitHub counts it as passed.
  changes:
    runs-on: ubuntu-latest
    outputs:
      workspace: ${{ steps.diff.outputs.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The workspace's members are the folders under `workspace:` in the
      # root pubspec.yaml, the same list Melos picks packages from.
      - name: Check whether the pull request changed a workspace package
        id: diff
        run: |
          members=$(yq '.workspace[]' pubspec.yaml)
          if git diff --name-only ${{ github.event.pull_request.base.sha }} HEAD -- $members | grep -q .; then
            echo "workspace=true" >> "$GITHUB_OUTPUT"
          else
            echo "workspace=false" >> "$GITHUB_OUTPUT"
          fi

  enforce-coverage:
    needs: changes
    if: needs.changes.outputs.workspace == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The repository root's .fvmrc pins the one Flutter SDK the workspace
      # uses. Developers switch to it with fvm; CI reads the same pin and
      # installs that version directly.
      - name: Read the pinned Flutter version
        id: flutter
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter.outputs.version }}
          channel: stable
          cache: true

      # lcov (used by tool/coverage.dart to leave excluded files out) isn't
      # preinstalled on ubuntu-latest.
      - name: Install lcov
        run: sudo apt-get update && sudo apt-get install -y lcov

      # Resolves the workspace and runs tool/coverage.dart in every workspace
      # package the pull request changed — see the Makefile.
      - name: Check coverage of the changed workspace packages
        run: make workspace-test BASE=${{ github.event.pull_request.base.sha }}
