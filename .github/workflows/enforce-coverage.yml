name: Enforce coverage

on:
  pull_request:
    branches:
      - main
      - develop

jobs:
  enforce-coverage:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The repository root's .fvmrc pins the one Flutter SDK every package
      # in the workspace builds and tests with.
      - name: Install fvm
        run: curl -fsSL https://fvm.app/install.sh | bash

      - name: Add fvm to PATH
        run: echo "$HOME/fvm/bin" >> "$GITHUB_PATH"

      - name: Cache fvm SDK versions
        uses: actions/cache@v4
        with:
          path: ~/fvm/versions
          key: fvm-versions-${{ hashFiles('.fvmrc') }}
          restore-keys: fvm-versions-

      - name: Install pinned Flutter SDK version via FVM
        run: fvm install

      # Resolves the whole workspace, Melos included.
      - name: Install workspace dependencies
        run: fvm flutter pub get

      # The root .fvmrc pins a Flutter version, so the step above already
      # made fvm download the full SDK (bundled Dart included) into
      # ~/fvm/versions — the same directory cached above. Point plain
      # flutter/dart at that instead of installing a second SDK copy via
      # flutter-action.
      - name: Add FVM's downloaded Flutter SDK to PATH
        run: |
          FLUTTER_VERSION=$(jq -r .flutter .fvmrc)
          echo "$HOME/fvm/versions/$FLUTTER_VERSION/bin" >> "$GITHUB_PATH"

      # Needed to convert a pure-Dart package's raw `dart test --coverage`
      # output into lcov — see tool/coverage.dart.
      - name: Activate the coverage package
        run: dart pub global activate coverage

      # lcov (used by tool/coverage.dart to leave excluded files out) isn't
      # preinstalled on ubuntu-latest.
      - name: Install lcov
        run: sudo apt-get update && sudo apt-get install -y lcov

      # Melos runs tool/coverage.dart in every workspace package the pull
      # request changed.
      - name: Check coverage of the changed workspace packages
        run: >
          dart run melos exec
          --diff=${{ github.event.pull_request.base.sha }}
          --concurrency=1
          -- dart run '$MELOS_ROOT_PATH/tool/coverage.dart'

      # app_template and its own packages keep their own resolution, outside
      # the workspace, so Melos doesn't see them: each changed one is checked
      # here.
      - name: Check coverage of the changed app_template packages
        run: |
          BASE=${{ github.event.pull_request.base.sha }}
          for dir in app_template app_template/packages/*; do
            [ -f "$dir/pubspec.yaml" ] || continue
            if [ "$dir" = app_template ]; then
              changed=$(git diff --name-only "$BASE" HEAD -- app_template ':!app_template/packages')
            else
              changed=$(git diff --name-only "$BASE" HEAD -- "$dir")
            fi
            [ -n "$changed" ] || continue
            echo "::group::$dir"
            (cd "$dir" && flutter pub get && dart run "$GITHUB_WORKSPACE/tool/coverage.dart")
            echo "::endgroup::"
          done
