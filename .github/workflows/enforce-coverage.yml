name: Enforce coverage

on:
  pull_request:
    branches:
      - main
      - develop

jobs:
  enforce-coverage:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The repository root's .fvmrc pins the one Flutter SDK the workspace
      # uses. Developers switch to it with fvm; CI reads the same pin and
      # installs that version directly.
      - name: Read the pinned Flutter version
        id: flutter
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter.outputs.version }}
          channel: stable
          cache: true

      # Resolves the whole workspace, Melos included.
      - name: Install workspace dependencies
        run: flutter pub get

      # Needed to convert a pure-Dart package's raw `dart test --coverage`
      # output into lcov — see tool/coverage.dart.
      - name: Activate the coverage package
        run: dart pub global activate coverage

      # lcov (used by tool/coverage.dart to leave excluded files out) isn't
      # preinstalled on ubuntu-latest.
      - name: Install lcov
        run: sudo apt-get update && sudo apt-get install -y lcov

      # Melos runs tool/coverage.dart in every workspace package the pull
      # request changed.
      - name: Check coverage of the changed workspace packages
        run: >
          dart run melos exec
          --diff=${{ github.event.pull_request.base.sha }}
          --concurrency=1
          -- dart run '$MELOS_ROOT_PATH/tool/coverage.dart'

      # app_template and its own packages keep their own resolution, outside
      # the workspace, so Melos doesn't see them: each changed one is checked
      # here.
      - name: Check coverage of the changed app_template packages
        run: |
          BASE=${{ github.event.pull_request.base.sha }}
          for dir in app_template app_template/packages/*; do
            [ -f "$dir/pubspec.yaml" ] || continue
            if [ "$dir" = app_template ]; then
              changed=$(git diff --name-only "$BASE" HEAD -- app_template ':!app_template/packages')
            else
              changed=$(git diff --name-only "$BASE" HEAD -- "$dir")
            fi
            [ -n "$changed" ] || continue
            echo "::group::$dir"
            (cd "$dir" && flutter pub get && dart run "$GITHUB_WORKSPACE/tool/coverage.dart")
            echo "::endgroup::"
          done
