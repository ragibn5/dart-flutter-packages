name: Workspace checks

on:
  pull_request:
    branches:
      - main
      - develop

jobs:
  # Always runs and reports, so the checks job below can be a required
  # check: when it's skipped by its `if`, GitHub counts it as passed.
  changes:
    runs-on: ubuntu-latest
    outputs:
      workspace: ${{ steps.diff.outputs.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Melos decides which workspace packages changed, so the Dart SDK is
      # enough here — see the Makefile.
      - uses: ./.github/actions/setup
        with:
          sdk: dart

      - name: Check whether the pull request changed a workspace package
        id: diff
        run: echo "workspace=$(make -s workspace-changed BASE=${{ github.event.pull_request.base.sha }})" >> "$GITHUB_OUTPUT"

  workspace-checks:
    needs: changes
    if: needs.changes.outputs.workspace == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Flutter from the root's .fvmrc, and lcov for tool/coverage.dart.
      - uses: ./.github/actions/setup
        with:
          lcov: 'true'

      # The workspace packages the pull request changed — see the Makefile.
      - name: Analyze the changed workspace packages
        run: make workspace-analyze BASE=${{ github.event.pull_request.base.sha }}

      - name: Check coverage of the changed workspace packages
        run: make workspace-test BASE=${{ github.event.pull_request.base.sha }}
