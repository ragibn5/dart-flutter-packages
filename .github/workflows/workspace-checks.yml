name: Workspace checks

on:
  pull_request:
    branches:
      - main
      - develop

jobs:
  workspace-checks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      # The coverage check needs lcov, which ubuntu-latest doesn't have.
      - name: Install lcov
        run: sudo apt-get update && sudo apt-get install -y lcov

      - name: Set up the workspace
        run: make setup

      # Only in the packages the pull request changed, and those that depend
      # on them.
      - name: Analyze the changed workspace packages
        run: dart run melos run analyze --no-select --diff=${{ github.event.pull_request.base.sha }} --include-dependents

      - name: Check coverage of the changed workspace packages
        run: dart run melos run coverage --no-select --diff=${{ github.event.pull_request.base.sha }} --include-dependents
