name: app_template coverage

on:
  pull_request:
    branches:
      - main
      - develop

jobs:
  # Always runs and reports, so the coverage job below can be a required
  # check: when it's skipped by its `if`, GitHub counts it as passed.
  changes:
    runs-on: ubuntu-latest
    outputs:
      app_template: ${{ steps.diff.outputs.app_template }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check whether the pull request changed app_template
        id: diff
        run: |
          if git diff --name-only ${{ github.event.pull_request.base.sha }} HEAD -- app_template | grep -q .; then
            echo "app_template=true" >> "$GITHUB_OUTPUT"
          else
            echo "app_template=false" >> "$GITHUB_OUTPUT"
          fi

  app-template-coverage:
    needs: changes
    if: needs.changes.outputs.app_template == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # app_template keeps its own resolution and Flutter pin, outside the
      # workspace, so it's checked here with its own .fvmrc.
      - name: Read app_template's pinned Flutter version
        id: flutter
        run: echo "version=$(jq -r .flutter app_template/.fvmrc)" >> "$GITHUB_OUTPUT"

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter.outputs.version }}
          channel: stable
          cache: true

      # lcov (used by tool/coverage.dart to leave excluded files out) isn't
      # preinstalled on ubuntu-latest.
      - name: Install lcov
        run: sudo apt-get update && sudo apt-get install -y lcov

      # Checks app_template and each of its packages the pull request
      # changed — see the Makefile.
      - name: Check coverage of the changed app_template packages
        run: make app-template-test BASE=${{ github.event.pull_request.base.sha }}
