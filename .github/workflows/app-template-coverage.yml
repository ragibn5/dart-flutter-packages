name: app_template coverage

on:
  pull_request:
    branches:
      - main
      - develop

jobs:
  # Always runs and reports, so the coverage job below can be a required
  # check: when it's skipped by its `if`, GitHub counts it as passed.
  changes:
    runs-on: ubuntu-latest
    outputs:
      app_template: ${{ steps.diff.outputs.app_template }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check whether the pull request changed app_template
        id: diff
        run: echo "app_template=$(make -s app-template-changed BASE=${{ github.event.pull_request.base.sha }})" >> "$GITHUB_OUTPUT"

  app-template-coverage:
    needs: changes
    if: needs.changes.outputs.app_template == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # app_template keeps its own Flutter pin, outside the workspace, so
      # Flutter comes from its .fvmrc; lcov is for tool/coverage.dart.
      - uses: ./.github/actions/setup
        with:
          flutter-version-target: app-template-flutter-version
          lcov: 'true'

      # Checks app_template and each of its packages the pull request
      # changed — see the Makefile.
      - name: Check coverage of the changed app_template packages
        run: make app-template-test BASE=${{ github.event.pull_request.base.sha }}
