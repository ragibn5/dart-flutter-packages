name: Validate release merge

on:
  pull_request:
    branches:
      - main

jobs:
  validate-release-merge:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - name: Set up the workspace
        run: make setup

      # A dry run for every package whose version isn't published yet; --yes
      # skips the confirmation prompt.
      - name: Check the packages to release
        run: dart run melos publish --yes
