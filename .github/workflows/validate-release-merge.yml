name: Validate release merge

on:
  pull_request:
    types: [ opened, synchronize, reopened ]
    branches:
      - main

jobs:
  validate-release-merge:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.9
          cache: true

      # Bootstrap SDK above is only for running dev_tools itself. Each
      # package may pin a different Flutter/Dart version via its own
      # .fvmrc, so the actual publish/dry-run must go through fvm rather
      # than the single hardcoded SDK above — otherwise a package could be
      # dry-run-checked (or published) against an incompatible SDK while
      # still claiming to support its pinned version.
      - name: Install fvm
        run: dart pub global activate fvm

      - name: Add pub-cache bin to PATH
        run: echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      # fvm downloads a pinned version on first use (no prior "fvm install"
      # needed), so this just caches whatever gets downloaded across runs
      # instead of re-fetching it every time.
      - name: Cache fvm SDK versions
        uses: actions/cache@v4
        with:
          path: ~/fvm/versions
          key: fvm-versions-${{ hashFiles('**/.fvmrc') }}
          restore-keys: fvm-versions-

      - name: Install dev_tools dependencies
        run: dart pub get -C dev_tools

      - name: Validate release candidates are complete
        run: >
          dart run dev_tools/bin/dev_tools.dart validate-release-mr
          --to ${{ github.event.pull_request.base.sha }}
