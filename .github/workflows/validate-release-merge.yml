name: Validate release merge

on:
  pull_request:
    types: [ opened, synchronize, reopened ]
    branches:
      - main

jobs:
  validate-release-merge:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The repository root's .fvmrc pins the one Flutter SDK the workspace
      # uses. Developers switch to it with fvm; CI reads the same pin and
      # installs that version directly.
      - name: Read the pinned Flutter version
        id: flutter
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter.outputs.version }}
          channel: stable
          cache: true

      # Dry-runs publishing every package whose version isn't on pub.dev yet
      # — see the Makefile.
      - name: Check the packages to release
        run: make release-check
