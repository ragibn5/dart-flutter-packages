name: Validate release merge

on:
  pull_request:
    types: [ opened, synchronize, reopened ]
    branches:
      - main

jobs:
  validate-release-merge:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Flutter from the root's .fvmrc.
      - uses: ./.github/actions/setup

      # Dry-runs publishing every package whose version isn't on pub.dev yet
      # — see the Makefile.
      - name: Check the packages to release
        run: make release-check
