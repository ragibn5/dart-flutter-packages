name: Validate release merge

on:
  pull_request:
    types: [ opened, synchronize, reopened ]
    branches:
      - main

jobs:
  validate-release-merge:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Flutter from the root's .fvmrc.
      - uses: ./.github/actions/setup

      - name: Set up the workspace
        run: make setup

      # melos publish dry-runs, unless given --no-dry-run, every package whose
      # version isn't on pub.dev yet; --yes skips its prompt.
      - name: Check the packages to release
        run: dart run melos publish --yes
