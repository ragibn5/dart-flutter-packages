name: Validate release merge

on:
  pull_request:
    branches:
      - main

jobs:
  validate-release-merge:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Set up the workspace
        run: make setup

      - name: Dry-run publishing the packages whose versions are unpublished
        run: dart run melos publish --yes
