name: feature_api_client
description: "A feature-based, type-safe API client over dio: one client per API feature, with typed requests, responses and errors."

repository: https://github.com/Ragibn5/dart-flutter-packages
issue_tracker: https://github.com/Ragibn5/dart-flutter-packages/issues
homepage: https://github.com/Ragibn5/dart-flutter-packages/tree/main/feature_api_client

# Library version
version: 2.0.0

# Range of compatible SDK versions
environment:
  sdk: ^3.6.0

# Resolved with the rest of the repository; see the root pubspec.
resolution: workspace

# Regular dependencies
dependencies:
  meta: ^1.12.0
  dart_functionals: ^1.0.1
  net_models: ^1.0.0
  dio: ^5.8.0+1

# Dev dependencies
# (NOT Bundled in executable artifact - For DEV use only)
dev_dependencies:
  test: ^1.25.5
  mocktail: ^1.0.5
  very_good_analysis: ^7.0.0
