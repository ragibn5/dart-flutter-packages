name: sqlite_db
description: A SQLite database client.

repository: https://github.com/ragibn5/dart-flutter-packages
issue_tracker: https://github.com/ragibn5/dart-flutter-packages/issues
homepage: https://github.com/ragibn5/dart-flutter-packages/tree/main/sqlite_db

# Library version
version: 1.0.0

# Range of compatible SDK versions
environment:
  sdk: ^3.11.0

# Resolved with the rest of the repository; see the root pubspec.
resolution: workspace

# Regular dependencies
dependencies:
  flutter:
    sdk: flutter
  path: ^1.9.0
  meta: ^1.12.0
  sqflite: ^2.4.2

# Dev dependencies
# (NOT Bundled in executable artifact - For DEV use only)
dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  sqflite_common: ^2.5.8
  very_good_analysis: ^7.0.0
