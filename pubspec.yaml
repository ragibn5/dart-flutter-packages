name: dart_flutter_packages
description: The workspace of this repository's packages.
publish_to: none

environment:
  sdk: ^3.11.0

# Every package resolves together, against this root's pinned SDK.
# app_template and the example and demo apps stay outside: they keep their
# own resolution.
workspace:
  - analysis_plugin_test_helper
  - analysis_server_plugin_core
  - base_auth_interceptor
  - clean_arch_linter
  - collection_utils
  - color_utils
  - dart_functionals
  - dev_tools
  - document_tree/document_tree_android
  - extended_datetime
  - extended_string
  - feature_api_client
  - file_store
  - generator_core
  - infinity_menu
  - infinity_radio_group
  - infinity_selection_group
  - json_coder
  - json_coder/json_parser_annotations
  - json_coder/json_parser_generator
  - json_coder/json_parser_linter
  - loghub
  - media_provider/media_provider_android
  - net_models
  - parser_core
  - preference_store
  - sqlite_db
  - user_provider/user_provider_android

dev_dependencies:
  melos: ^8.10.1
  # For tool/coverage.dart
  path: ^1.9.0
  yaml: ^3.1.2

melos:
  scripts:
    analyze:
      description: Analyze every package.
      exec:
        command: dart analyze
        concurrency: 4

    test:
      description: Run every package's tests, Dart or Flutter alike.
      exec:
        command: flutter test
        concurrency: 1
      packageFilters:
        dirExists: test

    coverage:
      description: >-
        Check each package's test coverage: tool/coverage.dart, with the root's
        and each package's coverage.yaml.
      exec:
        command: dart run "$MELOS_ROOT_PATH/tool/coverage.dart"
        concurrency: 1

    release:check:
      description: Dry-run publishing every package whose version isn't on pub.dev.
      run: dart run melos publish --yes

