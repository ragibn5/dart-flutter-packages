name: extended_datetime
description: Collection of extensions and utils specific to Date & Time manipulation.

repository: https://github.com/ragibn5/dart-flutter-packages
issue_tracker: https://github.com/ragibn5/dart-flutter-packages/issues
homepage: https://github.com/ragibn5/dart-flutter-packages/tree/main/extended_datetime

# Library version
version: 1.0.0

# Range of compatible SDK versions
environment:
  sdk: ^3.6.0

# Resolved with the rest of the repository; see the root pubspec.
resolution: workspace

# Regular dependencies
# (Bundled in executable artifact)
dependencies:
  timezone: ^0.9.0

# Dev dependencies
# (NOT Bundled in executable artifact - For DEV use only)
dev_dependencies:
  test: ^1.25.5
  very_good_analysis: ^7.0.0
  dev_tools:
    path: ../dev_tools
