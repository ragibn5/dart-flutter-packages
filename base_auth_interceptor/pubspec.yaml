name: base_auth_interceptor
description: A dio interceptor that authorizes every request and, on an auth error, refreshes the auth data once and retries the request.

repository: https://github.com/ragibn5/dart-flutter-packages
issue_tracker: https://github.com/ragibn5/dart-flutter-packages/issues
homepage: https://github.com/ragibn5/dart-flutter-packages/tree/main/base_auth_interceptor

# Library version
version: 2.0.0

# Range of compatible SDK versions
environment:
  sdk: ^3.6.0

# Resolved with the rest of the repository; see the root pubspec.
resolution: workspace

# Regular dependencies
dependencies:
  dio: ^5.8.0+1

# Dev dependencies
# (NOT Bundled in executable artifact - For DEV use only)
dev_dependencies:
  test: ^1.25.5
  mocktail: ^1.0.5
  very_good_analysis: ^7.0.0
